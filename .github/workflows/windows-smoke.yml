name: windows-smoke

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/windows-runtime-smoke-test"
    paths:
      - ".github/workflows/windows-smoke.yml"
      - "scripts/windows-smoke.ps1"
      - "src-tauri/src/backend.rs"
      - "src-tauri/tauri.conf.json"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - "dsh-version"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out smoke test
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Stage self-contained Windows backend
        shell: bash
        run: |
          DSH_VERSION="$(cat dsh-version)"
          mkdir -p resources/backend
          cp "$(node -e 'process.stdout.write(process.execPath)')" resources/backend/node.exe
          cd resources/backend
          npm init -y >/dev/null 2>&1
          npm install "@deepseek-ai/dsh@${DSH_VERSION}"

      - name: Build current Windows installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run build

      - name: Install and run Windows smoke test
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          try {
            ./scripts/windows-smoke.ps1 -InstallerPath $installer.FullName
          } catch {
            $message = $_.Exception.Message.Replace("`r", " ").Replace("`n", " ")
            Write-Output "::error title=Windows runtime smoke test failed::$message"
            Get-ChildItem "$env:RUNNER_TEMP\dsh-windows-smoke" -File -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host "===== $($_.Name) ====="
                Get-Content $_.FullName -ErrorAction SilentlyContinue
              }
            throw
          }

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: windows-smoke-diagnostics
          path: ${{ runner.temp }}/dsh-windows-smoke
          if-no-files-found: warn
