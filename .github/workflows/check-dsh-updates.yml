name: check-dsh-updates

# Watches npm for new `@deepseek-ai/dsh` releases. When a newer version appears,
# it pins the new version, bumps the desktop app version, and pushes a `v*` tag
# that triggers the `release` workflow (which rebuilds the backend + web UI).
#
# Pushing a tag from a scheduled run needs a Personal Access Token so the push
# can trigger `release.yml`; provide it as the `RELEASE_TOKEN` secret.

on:
  schedule:
    - cron: "0 1 * * *" # daily at 01:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Compare @deepseek-ai/dsh versions
        id: compare
        run: |
          PINNED="$(cat dsh-version)"
          LATEST="$(npm view @deepseek-ai/dsh version)"
          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "pinned dsh=$PINNED, latest dsh=$LATEST"
          if [ "$PINNED" = "$LATEST" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump and tag a new desktop release
        if: steps.compare.outputs.changed == 'true'
        env:
          LATEST: ${{ steps.compare.outputs.latest }}
        run: |
          set -euo pipefail
          echo "$LATEST" > dsh-version
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          VERSION="$(node -p "const [a,b,c] = '$CURRENT_VERSION'.split('.').map(Number); [a,b,c + 1].join('.')")"
          python3 scripts/set-desktop-version.py "$VERSION"
          python3 scripts/check-desktop-version.py "$VERSION"
          git add dsh-version package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore: bump @deepseek-ai/dsh to $LATEST (desktop v$VERSION)"
          git tag "v$VERSION"
          git push origin HEAD
          git push origin "v$VERSION"
